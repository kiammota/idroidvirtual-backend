services:
  api:
    container_name: idroid-api
    build: ./api
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/logs
    depends_on:
      - db
    restart: unless-stopped

  db:
    container_name: idroid-db
    image: postgres:17-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

volumes:
  postgres_data:
