  schemas:
    # ==================== COMMON SCHEMAS ====================
    ApiEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        data:
          type: object
        message:
          type: string

    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

    # ==================== REQUEST SCHEMAS ====================
    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          example: usuario@email.com
        senha:
          type: string
          format: password
          example: "123456"

    ElevateUserRequest:
      type: object
      required: [senha]
      properties:
        senha:
          type: string
          format: password
          example: "123456"

    CreateUserRequest:
      type: object
      required: [empresa_id, email, nome, senha]
      properties:
        empresa_id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: usuario@email.com
        nome:
          type: string
          example: "João Silva"
        senha:
          type: string
          format: password
          example: "123456"

    ClienteCreate:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          example: "João dos Santos"
        telefone:
          type: [string, "null"]
          nullable: true
          example: "75999999999"
        endereco:
          type: [string, "null"]
          nullable: true
          example: "Rua A, 123"
        email:
          type: [string, "null"]
          nullable: true
          format: email
          example: "joao@email.com"

    ProdutoCreate:
      type: object
      required: [nome, preco, estoque, categoria]
      properties:
        nome:
          type: string
          example: "iPhone 13 Pro"
        preco:
          type: number
          format: double
          example: 5999.99
        estoque:
          type: integer
          example: 10
        categoria:
          type: string
          example: "CELULAR"

    VendaCreate:
      type: object
      required: [produto_id, quantidade, tipo_pagamento]
      properties:
        produto_id:
          type: integer
          format: int64
          example: 1
        cliente_id:
          type: integer
          format: int64
          description: Envie 0 para Consumidor Final
          default: 0
          example: 0
        quantidade:
          type: integer
          minimum: 1
          example: 1
        tipo_pagamento:
          type: string
          enum: [PIX, CARTAO, DINHEIRO, TRANSFERENCIA]
          example: "PIX"
        usuario_id:
          type: integer
          format: int64
          example: 1
        total:
          type: number
          format: double
          nullable: true

    OrdemServicoCreate:
      type: object
      required: [cliente_id, status]
      properties:
        cliente_id:
          type: integer
          format: int64
          example: 1
        defeito:
          type: [string, "null"]
          nullable: true
          example: "Tela quebrada"
        servicos:
          type: [string, "null"]
          nullable: true
          example: "Troca de tela"
        assinatura:
          type: [string, "null"]
          nullable: true
        nome_servico:
          type: [string, "null"]
          nullable: true
        telefone:
          type: [string, "null"]
          nullable: true
        valor:
          type: [number, "null"]
          nullable: true
          format: double
        status:
          type: string
          example: "ABERTA"

    OrdemServicoUpdate:
      type: object
      properties:
        cliente_id:
          type: integer
          format: int64
        defeito:
          type: [string, "null"]
          nullable: true
        servicos:
          type: [string, "null"]
          nullable: true
        assinatura:
          type: [string, "null"]
          nullable: true
        nome_servico:
          type: [string, "null"]
          nullable: true
        telefone:
          type: [string, "null"]
          nullable: true
        valor:
          type: [number, "null"]
          nullable: true
          format: double
        status:
          type: string

    TrocaCreate:
      type: object
      required:
        - venda_id
        - modelo_aparelho
        - imei
        - valor_avaliacao
      properties:
        venda_id:
          type: integer
          format: int64
          example: 123
        modelo_aparelho:
          type: string
          example: "iPhone 13 Pro"
        imei:
          type: string
          example: "356789123456789"
        valor_avaliacao:
          type: number
          format: double
          example: 1500.00
        condicao:
          type: [string, "null"]
          nullable: true
          example: "USADO"
        observacoes:
          type: [string, "null"]
          nullable: true
          example: "Aparelho funcionando perfeitamente"

    # ==================== MODEL SCHEMAS ====================
    Usuario:
      type: object
      required: [id, email, nome, criado_em]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        email:
          type: string
          format: email
        nome:
          type: string
        empresa_id:
          type: integer
          format: int64
        criado_em:
          type: string
          format: date-time
          readOnly: true

    Cliente:
      type: object
      required: [id, nome, criado_em, atualizado_em]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        nome:
          type: string
        telefone:
          type: [string, "null"]
          nullable: true
        endereco:
          type: [string, "null"]
          nullable: true
        email:
          type: [string, "null"]
          nullable: true
          format: email
        criado_em:
          type: string
          format: date-time
          readOnly: true
        atualizado_em:
          type: string
          format: date-time
          readOnly: true

    Produto:
      type: object
      required: [id, nome, preco, estoque, categoria, criado_em, atualizado_em]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        nome:
          type: string
        preco:
          type: number
          format: double
        estoque:
          type: integer
        categoria:
          type: string
          example: "CELULAR"
        criado_em:
          type: string
          format: date-time
          readOnly: true
        atualizado_em:
          type: string
          format: date-time
          readOnly: true

    Venda:
      type: object
      required: [id, produto_id, usuario_id, quantidade, total, tipo_pagamento, status, criado_em]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        produto_id:
          type: integer
          format: int64
        usuario_id:
          type: integer
          format: int64
        cliente_id:
          type: integer
          format: int64
          description: 0 = Consumidor Final
        quantidade:
          type: integer
        total:
          type: number
          format: double
          readOnly: true
        tipo_pagamento:
          type: string
          enum: [PIX, CARTAO, DINHEIRO, TRANSFERENCIA]
        status:
          type: string
          enum: [CONCLUIDA, CANCELADA]
        criado_em:
          type: string
          format: date-time
          readOnly: true

    OrdemServico:
      type: object
      required: [id, numero_ordem, cliente_id, status, criado_em, atualizado_em]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        numero_ordem:
          type: integer
          format: int64
          readOnly: true
        cliente_id:
          type: integer
          format: int64
        defeito:
          type: [string, "null"]
          nullable: true
        servicos:
          type: [string, "null"]
          nullable: true
        assinatura:
          type: [string, "null"]
          nullable: true
        nome_servico:
          type: [string, "null"]
          nullable: true
        telefone:
          type: [string, "null"]
          nullable: true
        valor:
          type: [number, "null"]
          nullable: true
          format: double
        status:
          type: string
        criado_em:
          type: string
          format: date-time
          readOnly: true
        atualizado_em:
          type: string
          format: date-time
          readOnly: true

    Troca:
      type: object
      required: [id, venda_id, modelo_aparelho, imei, valor_avaliacao, criado_em]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        venda_id:
          type: integer
          format: int64
        modelo_aparelho:
          type: string
        imei:
          type: string
        valor_avaliacao:
          type: number
          format: double
        condicao:
          type: [string, "null"]
          nullable: true
        observacoes:
          type: [string, "null"]
          nullable: true
        criado_em:
          type: string
          format: date-time
          readOnly: true

    ResumoFinanceiro:
      type: object
      properties:
        total_vendas:
          type: number
          format: double
        total_trocas:
          type: number
          format: double
        total_ordens_servico:
          type: number
          format: double
        quantidade_vendas:
          type: integer
        quantidade_trocas:
          type: integer
        quantidade_ordens_servico:
          type: integer

    Auditoria:
      type: object
      properties:
        id:
          type: integer
          format: int64
        usuario_id:
          type: integer
          format: int64
        acao:
          type: string
          enum: [CREATE, UPDATE, DELETE]
        tabela:
          type: string
        registro_id:
          type: integer
          format: int64
        valores_antigos:
          type: [object, "null"]
          nullable: true
        valores_novos:
          type: [object, "null"]
          nullable: true
        horario:
          type: string
          format: date-time