    # ==================== SALE RESPONSES ====================
    SaleEnvelope:
      description: Venda encontrada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'

    SaleEnvelopeCreated:
      description: Venda criada com sucesso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'

    SaleListEnvelope:
      description: Lista de vendas
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  $ref: '#/components/schemas/Venda'
              message:
                type: string

    # ==================== SERVICE ORDER RESPONSES ====================
    ServiceOrderEnvelope:
      description: Ordem de serviço encontrada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'

    ServiceOrderEnvelopeCreated:
      description: Ordem de serviço criada com sucesso
