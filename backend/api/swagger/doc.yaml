openapi: 3.1.0
info:
  title: API REST - iDroid Virtual
  version: 1.0.0
  description: >
    Documentação da API REST do sistema.
    Backend em Go (Gin + pgx).

servers:
  - url: http://localhost:8080
    description: Ambiente local

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Users
  - name: Clients
  - name: Products
  - name: Sales
  - name: Closing
  - name: ServiceOrders
  - name: Auditoria

paths:
  # ==================== AUTH ====================
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Autentica um usuário e retorna o token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: usuario@email.com
              senha: "123456"
      responses:
        '200':
          description: Token JWT gerado com sucesso
          content:
            text/plain:
              schema:
                type: string
                example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            application/json:
              schema:
                type: string
                example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== USERS ====================
  /users:
    post:
      tags: [Users]
      operationId: createUser
      summary: Cria um novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{id}:
    get:
      tags: [Users]
      operationId: getUserById
      summary: Busca usuário por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/elevate:
    post:
      tags: [Users]
      operationId: elevateUser
      summary: Valida senha administrativa do usuário
      description: Libera operações sensíveis na sessão atual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElevateUserRequest'
            example:
              senha: "123456"
      responses:
        '200':
          description: Senha administrativa validada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== CLIENTS ====================
  /clients:
    post:
      tags: [Clients]
      operationId: createClient
      summary: Cria um cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteCreate'
      responses:
        '201':
          $ref: '#/components/responses/ClientEnvelopeCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Clients]
      operationId: listClients
      summary: Lista clientes
      responses:
        '200':
          $ref: '#/components/responses/ClientListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/{id}:
    get:
      tags: [Clients]
      operationId: getClientById
      summary: Busca cliente por ID
      parameters:
        - $ref: '#/components/parameters/ClientIdPath'
      responses:
        '200':
          $ref: '#/components/responses/ClientEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/number:
    get:
      tags: [Clients]
      operationId: searchClientsByPhone
      summary: Busca clientes por telefone
      parameters:
        - name: telefone
          in: query
          required: true
          schema:
            type: string
          example: "75999999999"
      responses:
        '200':
          $ref: '#/components/responses/ClientListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/address:
    get:
      tags: [Clients]
      operationId: searchClientsByAddress
      summary: Busca clientes por endereço
      parameters:
        - name: endereco
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ClientListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/name:
    get:
      tags: [Clients]
      operationId: searchClientsByName
      summary: Busca clientes por nome
      parameters:
        - name: nome
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ClientListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/email:
    get:
      tags: [Clients]
      operationId: searchClientsByEmail
      summary: Busca clientes por email
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          $ref: '#/components/responses/ClientListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== PRODUCTS ====================
  /products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Lista produtos
      responses:
        '200':
          $ref: '#/components/responses/ProductListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Cria um produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoCreate'
      responses:
        '201':
          $ref: '#/components/responses/ProductEnvelopeCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /products/category/{category}:
    get:
      tags: [Products]
      operationId: listProductsByCategory
      summary: Lista produtos por categoria
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
          example: CELULAR
      responses:
        '200':
          $ref: '#/components/responses/ProductListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /products/{id}:
    post:
      tags: [Products]
      operationId: updateProduct
      summary: Atualiza um produto
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoCreate'
      responses:
        '200':
          $ref: '#/components/responses/ProductEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Remove um produto
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      responses:
        '200':
          $ref: '#/components/responses/EmptyEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== SALES ====================
  /sales:
    post:
      tags: [Sales]
      operationId: createSale
      summary: Registra uma venda
      description: >
        Cria uma venda. O total e o status são calculados/definidos pela API.
        Envie cliente_id = 0 para "Consumidor Final".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendaCreate'
      responses:
        '201':
          $ref: '#/components/responses/SaleEnvelopeCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /sales/{id}:
    delete:
      tags: [Sales]
      operationId: deleteSale
      summary: Cancela ou remove uma venda
      parameters:
        - $ref: '#/components/parameters/SaleIdPath'
      responses:
        '200':
          $ref: '#/components/responses/EmptyEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sales/dia:
    get:
      tags: [Sales]
      operationId: listSalesByDay
      summary: Vendas do dia
      responses:
        '200':
          $ref: '#/components/responses/GenericEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /sales/mes:
    get:
      tags: [Sales]
      operationId: listSalesByMonth
      summary: Vendas do mês
      responses:
        '200':
          $ref: '#/components/responses/GenericEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== CLOSING ====================
  /closing/dia:
    get:
      tags: [Closing]
      operationId: closingByDay
      summary: Fechamento do dia
      responses:
        '200':
          $ref: '#/components/responses/GenericEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /closing/mes:
    get:
      tags: [Closing]
      operationId: closingByMonth
      summary: Fechamento do mês
      responses:
        '200':
          $ref: '#/components/responses/GenericEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== SERVICE ORDERS ====================
  /service-orders:
    post:
      tags: [ServiceOrders]
      operationId: createServiceOrder
      summary: Cria uma ordem de serviço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdemServicoCreate'
      responses:
        '201':
          $ref: '#/components/responses/ServiceOrderEnvelopeCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrders
      summary: Lista ordens de serviço
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/{id}:
    get:
      tags: [ServiceOrders]
      operationId: getServiceOrderById
      summary: Busca ordem de serviço por ID
      parameters:
        - $ref: '#/components/parameters/ServiceOrderIdPath'
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [ServiceOrders]
      operationId: patchServiceOrder
      summary: Atualiza parcialmente uma ordem de serviço
      parameters:
        - $ref: '#/components/parameters/ServiceOrderIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdemServicoUpdate'
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [ServiceOrders]
      operationId: deleteServiceOrder
      summary: Remove uma ordem de serviço
      parameters:
        - $ref: '#/components/parameters/ServiceOrderIdPath'
      responses:
        '200':
          $ref: '#/components/responses/EmptyEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/client-id/{cliente_id}:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersByClientId
      summary: Lista ordens por cliente ID
      parameters:
        - $ref: '#/components/parameters/ClienteIdPath'
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/client-name/{client_name}:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersByClientName
      summary: Lista ordens por nome do cliente
      parameters:
        - $ref: '#/components/parameters/ClientNamePath'
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/client-email/{client_email}:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersByClientEmail
      summary: Lista ordens por email do cliente
      parameters:
        - $ref: '#/components/parameters/ClientEmailPath'
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/client-number/{client_number}:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersByClientNumber
      summary: Lista ordens por número do cliente
      parameters:
        - $ref: '#/components/parameters/ClientNumberPath'
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/three-months:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersLastThreeMonths
      summary: Ordens dos últimos três meses
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/six-months:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersLastSixMonths
      summary: Ordens dos últimos seis meses
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== AUDITORIA ====================
  /auditoria:
    get:
      tags: [Auditoria]
      operationId: listarAuditorias
      summary: Lista registros de auditoria
      parameters:
        - name: periodo
          in: query
          required: false
          schema:
            type: string
            enum: [dia, semana, mes]
            default: dia
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: itens_por_pagina
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Lista de auditorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Auditoria'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ClientIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProductIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SaleIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ServiceOrderIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ClienteIdPath:
      name: cliente_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ClientNamePath:
      name: client_name
      in: path
      required: true
      schema:
        type: string
    ClientEmailPath:
      name: client_email
      in: path
      required: true
      schema:
        type: string
        format: email
    ClientNumberPath:
      name: client_number
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    Unauthorized:
      description: Não autenticado ou token inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    InternalError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    EmptyEnvelope:
      description: Operação concluída
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    GenericEnvelope:
      description: Resposta genérica
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    ClientEnvelope:
      description: Resposta com um cliente
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cliente'
    ClientListEnvelope:
      description: Lista de clientes
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cliente'
    ClientEnvelopeCreated:
      description: Cliente criado
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cliente'
    ProductEnvelope:
      description: Resposta com um produto
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Produto'
    ProductListEnvelope:
      description: Lista de produtos
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Produto'
    ProductEnvelopeCreated:
      description: Produto criado
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Produto'
    SaleEnvelopeCreated:
      description: Venda criada
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Venda'
    ServiceOrderEnvelope:
      description: Resposta com uma OS
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrdemServico'
    ServiceOrderEnvelopeCreated:
      description: OS criada
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrdemServico'
    ServiceOrderListEnvelope:
      description: Lista de OS
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrdemServico'

  schemas:
    ApiEnvelope:
      type: object
      required: [data, success, message]
      properties:
        data: {}
        success:
          type: boolean
        message:
          type: string

    LoginRequest:
      type: object
      required: [login, senha]
      properties:
        login:
          type: string
          example: usuario@email.com
        senha:
          type: string
          format: password

    ElevateUserRequest:
      type: object
      required: [senha]
      properties:
        senha:
          type: string
          format: password

    CreateUserRequest:
      type: object
      required: [empresa_id, email, nome, senha]
      properties:
        empresa_id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        nome:
          type: string
        senha:
          type: string
          format: password

    Cliente:
      type: object
      required: [id, nome, criado_em, atualizado_em]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        nome:
          type: string
        telefone:
          type: [string, "null"]
          nullable: true
        endereco:
          type: [string, "null"]
          nullable: true
        email:
          type: [string, "null"]
          nullable: true
        criado_em:
          type: string
          format: date-time
          readOnly: true
        atualizado_em:
          type: string
          format: date-time
          readOnly: true

    ClienteCreate:
      type: object
