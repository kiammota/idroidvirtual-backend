openapi: 3.1.0
info:
  title: API REST - iDroid Virtual
  version: 1.0.0
  description: >
    Documentação da API REST do Idroid.
    Backend em Go (Gin + pgx).

servers:
  - url: http://localhost:8080
    description: Ambiente local

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Users
  - name: Clients
  - name: Products
  - name: Sales
  - name: ServiceOrders
  - name: Exchanges (Trocas)
  - name: Financial
  - name: Auditoria

paths:

  /expenses:
    get:
      tags: [Expenses]
      operationId: listExpenses
      summary: Lista todas as despesas
      responses:
        '200':
          $ref: '#/components/responses/ExpensesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Expenses]
      operationId: createExpense
      summary: Cria uma nova despesa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCreatePayload'
      responses:
        '201':
          $ref: '#/components/responses/ExpenseSingleEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /expenses/{id}:
    put:
      tags: [Expenses]
      operationId: updateExpense
      summary: Atualiza uma despesa existente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseUpdatePayload'
      responses:
        '200':
          $ref: '#/components/responses/ExpenseSingleEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Expenses]
      operationId: deleteExpense
      summary: Remove uma despesa
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  # ==================== AUTH ====================
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Autentica um usuário e retorna o token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: usuario@email.com
              senha: "123456"
      responses:
        '200':
          description: Token JWT gerado com sucesso
          content:
            text/plain:
              schema:
                type: string
                example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            application/json:
              schema:
                type: string
                example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== USERS ====================
  /users:
    post:
      tags: [Users]
      operationId: createUser
      summary: Cria um novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{id}:
    get:
      tags: [Users]
      operationId: getUserById
      summary: Busca usuário por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/elevate:
    post:
      tags: [Users]
      operationId: elevateUser
      summary: Valida senha administrativa do usuário
      description: Libera operações sensíveis na sessão atual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElevateUserRequest'
            example:
              senha: "123456"
      responses:
        '200':
          description: Senha administrativa validada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== CLIENTS ====================
  /clients:
    post:
      tags: [Clients]
      operationId: createClient
      summary: Cria um cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteCreate'
      responses:
        '201':
          $ref: '#/components/responses/ClientEnvelopeCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Clients]
      operationId: listClients
      summary: Lista clientes
      responses:
        '200':
          $ref: '#/components/responses/ClientListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/{id}:
    get:
      tags: [Clients]
      operationId: getClientById
      summary: Busca cliente por ID
      parameters:
        - $ref: '#/components/parameters/ClientIdPath'
      responses:
        '200':
          $ref: '#/components/responses/ClientEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/number:
    get:
      tags: [Clients]
      operationId: searchClientsByPhone
      summary: Busca clientes por telefone
      parameters:
        - name: telefone
          in: query
          required: true
          schema:
            type: string
          example: "75999999999"
      responses:
        '200':
          $ref: '#/components/responses/ClientListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/address:
    get:
      tags: [Clients]
      operationId: searchClientsByAddress
      summary: Busca clientes por endereço
      parameters:
        - name: endereco
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ClientListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/name:
    get:
      tags: [Clients]
      operationId: searchClientsByName
      summary: Busca clientes por nome
      parameters:
        - name: nome
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ClientListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/email:
    get:
      tags: [Clients]
      operationId: searchClientsByEmail
      summary: Busca clientes por email
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          $ref: '#/components/responses/ClientListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== PRODUCTS ====================
  /products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Lista produtos
      responses:
        '200':
          $ref: '#/components/responses/ProductListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Cria um produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoCreate'
      responses:
        '201':
          $ref: '#/components/responses/ProductEnvelopeCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /products/{id}:
    get:
      tags: [Products]
      operationId: getProductById
      summary: Busca produto por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          $ref: '#/components/responses/ProductEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /products/category/{category}:
    get:
      tags: [Products]
      operationId: listProductsByCategory
      summary: Lista produtos por categoria
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
          example: CELULAR
      responses:
        '200':
          $ref: '#/components/responses/ProductListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== SALES ====================
  /sales:
    post:
      tags: [Sales]
      operationId: createSale
      summary: Cria uma nova venda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendaCreate'
      responses:
        '201':
          $ref: '#/components/responses/SaleEnvelopeCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /sales/{id}:
    get:
      tags: [Sales]
      operationId: getSaleById
      summary: Busca uma venda por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          $ref: '#/components/responses/SaleEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Sales]
      operationId: cancelSale
      summary: Cancela uma venda
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario_id]
              properties:
                usuario_id:
                  type: integer
                  format: int64
                motivo:
                  type: string
                  default: "Cancelamento manual"
      responses:
        '200':
          description: Venda cancelada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sales/dia:
    get:
      tags: [Sales]
      operationId: listSalesByDay
      summary: Lista vendas do dia atual
      responses:
        '200':
          $ref: '#/components/responses/SaleListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /sales/mes:
    get:
      tags: [Sales]
      operationId: listSalesByMonth
      summary: Lista vendas do mês atual
      responses:
        '200':
          $ref: '#/components/responses/SaleListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== SERVICE ORDERS ====================
  /service-orders:
    post:
      tags: [ServiceOrders]
      operationId: createServiceOrder
      summary: Cria uma nova ordem de serviço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdemServicoCreate'
      responses:
        '201':
          $ref: '#/components/responses/ServiceOrderEnvelopeCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrders
      summary: Lista todas as ordens de serviço
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/{id}:
    get:
      tags: [ServiceOrders]
      operationId: getServiceOrderById
      summary: Busca ordem de serviço por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [ServiceOrders]
      operationId: updateServiceOrder
      summary: Atualiza uma ordem de serviço
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdemServicoUpdate'
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [ServiceOrders]
      operationId: deleteServiceOrder
      summary: Deleta uma ordem de serviço
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Ordem de serviço deletada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/three-months:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersLastThreeMonths
      summary: Lista ordens de serviço dos últimos 3 meses
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/six-months:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersLastSixMonths
      summary: Lista ordens de serviço dos últimos 6 meses
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/client-id/{clientId}:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersByClientId
      summary: Lista ordens de serviço por ID do cliente
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/client-name/{clientName}:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersByClientName
      summary: Lista ordens de serviço por nome do cliente
      parameters:
        - name: clientName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/client-email/{clientEmail}:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersByClientEmail
      summary: Lista ordens de serviço por email do cliente
      parameters:
        - name: clientEmail
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/client-number/{clientNumber}:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersByClientNumber
      summary: Lista ordens de serviço por número do cliente
      parameters:
        - name: clientNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/status/{status}:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersByStatus
      summary: Lista ordens de serviço por status
      parameters:
        - name: status
          in: path
          required: true
          schema:
            type: string
          example: ABERTA
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== EXCHANGES (TROCAS) ====================
  /api/v1/trocas:
    post:
      tags: [Exchanges (Trocas)]
      operationId: createExchange
      summary: Cria uma nova troca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrocaCreate'
      responses:
        '201':
          $ref: '#/components/responses/ExchangeEnvelopeCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/trocas/venda/{vendaId}:
    get:
      tags: [Exchanges (Trocas)]
      operationId: getExchangeByVendaId
      summary: Busca troca por ID de venda
      parameters:
        - name: vendaId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          $ref: '#/components/responses/ExchangeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== FINANCIAL ====================
  /financial/today:
    get:
      tags: [Financial]
      operationId: getFinancialToday
      summary: Obtém resumo financeiro do dia atual
      responses:
        '200':
          $ref: '#/components/responses/FinancialEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /financial/month:
    get:
      tags: [Financial]
      operationId: getFinancialMonth
      summary: Obtém resumo financeiro do mês atual
      responses:
        '200':
          $ref: '#/components/responses/FinancialEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /financial/period:
    get:
      tags: [Financial]
      operationId: getFinancialPeriod
      summary: Obtém resumo financeiro por período
      parameters:
        - name: inicio
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2024-01-01"
        - name: fim
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2024-01-31"
      responses:
        '200':
          $ref: '#/components/responses/FinancialEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  

  # ==================== AUDITORIA ====================
  /auditoria:
    get:
      tags: [Auditoria]
      operationId: listAuditoria
      summary: Lista logs de auditoria
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          $ref: '#/components/responses/AuditoriaListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ClientIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: ID do cliente

  responses:
    # ==================== COMMON RESPONSES ====================
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Campo obrigatório faltando"

    Unauthorized:
      description: Não autorizado (token inválido ou ausente)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Token inválido ou expirado"

    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Recurso não encontrado"

    InternalError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "Erro interno do servidor"

    # ==================== CLIENT RESPONSES ====================
    ClientEnvelope:
      description: Cliente encontrado
