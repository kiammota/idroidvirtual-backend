openapi: 3.1.0
info:
  title: API REST
  version: 1.0.0
  description: >
    Documentação OpenAPI 3.1 gerada a partir das rotas e structs em Go fornecidas.
    Considerei o endpoint GET /products/{categoria} como uma listagem de produtos
    filtrada pela categoria informada na rota.

servers:
  - url: http://localhost:8080
    description: Ambiente local
    variables:
      port:
        default: "7192"
        description: Porta da API

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Clients
  - name: Products
  - name: Sales
  - name: Closing
  - name: ServiceOrders

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Autentica um usuário e retorna o token JWT
      description: >
        Recebe login e senha. Conforme sua última confirmação, esta rota retorna
        apenas o token JWT em texto puro.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              exemplo:
                value:
                  email: usuario@email.com
                  senha: 123456
      responses:
        '200':
          description: Token JWT gerado com sucesso
          content:
            text/plain:
              schema:
                type: string
                example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            application/json:
              schema:
                type: string
                example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users:
    post:
      tags: [Users]
      operationId: createUser
      security:
        - bearerAuth: []
      summary: Cria um novo usuário
      description: |
        Cria um usuário no sistema.
        Os dados são enviados no corpo da requisição.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              exemplo:
                value:
                  nome: João Silva
                  email: usuario@email.com
                  senha: 123456
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
              example:
                data:
                  id: 1
                  nome: João Silva
                  email: usuario@email.com
                success: true
                message: "Usuário criado com sucesso"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'


  /users/{id}:
    get:
      tags: [Users]
      operationId: getUserById
      security:
        - bearerAuth: []
      summary: Busca usuário por ID
      description: |
        Retorna os dados de um usuário específico através do identificador.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do usuário
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
              example:
                data:
                  id: 1
                  nome: João Silva
                  email: usuario@email.com
                success: true
                message: "Usuário encontrado"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'


  /users/elevate:
    post:
      tags: [Users]
      operationId: elevateUser
      security:
        - bearerAuth: []
      summary: Valida senha administrativa do usuário
      description: |
        Solicita a senha administrativa do usuário autenticado
        para liberar operações sensíveis durante a sessão atual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElevateUserRequest'
            examples:
              exemplo:
                value:
                  senha: "123456"
      responses:
        '200':
          description: Senha administrativa validada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
              example:
                data: null
                success: true
                message: "Senha administrativa validada"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/:
    post:
      tags: [Clients]
      operationId: createClient
      summary: Cria um cliente
      description: Cria um novo cliente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteCreate'
      responses:
        '201':
          $ref: '#/components/responses/ClientEnvelopeCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Clients]
      operationId: listClients
      summary: Lista clientes
      description: Retorna todos os clientes cadastrados.
      responses:
        '200':
          $ref: '#/components/responses/ClientListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/{id}:
    get:
      tags: [Clients]
      operationId: getClientById
      summary: Busca cliente por ID
      description: Retorna um cliente pelo identificador numérico.
      parameters:
        - $ref: '#/components/parameters/ClientIdPath'
      responses:
        '200':
          $ref: '#/components/responses/ClientEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/number:
    get:
      tags: [Clients]
      operationId: searchClientsByPhone
      summary: Busca clientes por telefone
      description: Filtra clientes pelo telefone informado em query string.
      parameters:
        - name: telefone
          in: query
          required: true
          schema:
            type: string
          example: "75999999999"
      responses:
        '200':
          $ref: '#/components/responses/ClientListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/address:
    get:
      tags: [Clients]
      operationId: searchClientsByAddress
      summary: Busca clientes por endereço
      description: Filtra clientes pelo endereço informado em query string.
      parameters:
        - name: endereco
          in: query
          required: true
          schema:
            type: string
          example: "Rua A, 123"
      responses:
        '200':
          $ref: '#/components/responses/ClientListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/name:
    get:
      tags: [Clients]
      operationId: searchClientsByName
      summary: Busca clientes por nome
      description: Filtra clientes pelo nome informado em query string.
      parameters:
        - name: nome
          in: query
          required: true
          schema:
            type: string
          example: João
      responses:
        '200':
          $ref: '#/components/responses/ClientListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/email:
    get:
      tags: [Clients]
      operationId: searchClientsByEmail
      summary: Busca clientes por email
      description: Filtra clientes pelo email informado em query string.
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
          example: joao@gmail.com
      responses:
        '200':
          $ref: '#/components/responses/ClientListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Lista produtos
      description: Retorna todos os produtos cadastrados.
      responses:
        '200':
          $ref: '#/components/responses/ProductListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Cria um produto
      description: Cria um novo produto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoCreate'
      responses:
        '201':
          $ref: '#/components/responses/ProductEnvelopeCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /products/category/{category}:
    get:
      tags: [Products]
      operationId: listProductsByCategory
      summary: Lista produtos por categoria
      description: >
        Retorna todos os produtos filtrados pela categoria informada na rota.
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
          example: CELULAR
      responses:
        '200':
          $ref: '#/components/responses/ProductListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /products/{id}:
    post:
      tags: [Products]
      operationId: updateProduct
      summary: Atualiza um produto completo
      description: >
        Atualiza um produto existente com os campos mutáveis completos.
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoCreate'
      responses:
        '200':
          $ref: '#/components/responses/ProductEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Remove um produto
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      responses:
        '200':
          $ref: '#/components/responses/EmptyEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sales:
    post:
      tags: [Sales]
      operationId: createSale
      summary: Registra uma venda
      description: >
        Cria uma venda. O total, o ID e a data de criação são calculados pela API.
        O frontend pode buscar cliente e produto antes e enviar seus IDs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendaCreate'
      responses:
        '201':
          $ref: '#/components/responses/SaleEnvelopeCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /sales/{id}:
    delete:
      tags: [Sales]
      operationId: deleteSale
      summary: Cancela ou remove uma venda pelo ID
      parameters:
        - $ref: '#/components/parameters/SaleIdPath'
      responses:
        '200':
          $ref: '#/components/responses/EmptyEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sales/dia:
    get:
      tags: [Sales]
      operationId: listSalesByDay
      summary: Vendas do dia
      description: Retorna o resultado diário de vendas. O formato exato do data não foi especificado.
      responses:
        '200':
          $ref: '#/components/responses/GenericEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /sales/mes:
    get:
      tags: [Sales]
      operationId: listSalesByMonth
      summary: Vendas do mês
      description: Retorna o resultado mensal de vendas. O formato exato do data não foi especificado.
      responses:
        '200':
          $ref: '#/components/responses/GenericEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /closing/dia:
    get:
      tags: [Closing]
      operationId: closingByDay
      summary: Fechamento do dia
      description: Retorna o fechamento diário. O formato exato do data não foi especificado.
      responses:
        '200':
          $ref: '#/components/responses/GenericEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /closing/mes:
    get:
      tags: [Closing]
      operationId: closingByMonth
      summary: Fechamento do mês
      description: Retorna o fechamento mensal. O formato exato do data não foi especificado.
      responses:
        '200':
          $ref: '#/components/responses/GenericEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders:
    post:
      tags: [ServiceOrders]
      operationId: createServiceOrder
      summary: Cria uma ordem de serviço
      description: >
        Cria uma ordem de serviço. Os campos id, numero_ordem, criado_em e atualizado_em
        são preenchidos pela API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdemServicoCreate'
      responses:
        '201':
          $ref: '#/components/responses/ServiceOrderEnvelopeCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrders
      summary: Lista ordens de serviço
      description: Retorna todas as ordens de serviço.
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/{id}:
    get:
      tags: [ServiceOrders]
      operationId: getServiceOrderById
      summary: Busca ordem de serviço por ID
      parameters:
        - $ref: '#/components/parameters/ServiceOrderIdPath'
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [ServiceOrders]
      operationId: patchServiceOrder
      summary: Atualiza parcialmente uma ordem de serviço
      description: Atualiza apenas os campos enviados no corpo.
      parameters:
        - $ref: '#/components/parameters/ServiceOrderIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdemServicoUpdate'
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [ServiceOrders]
      operationId: deleteServiceOrder
      summary: Remove uma ordem de serviço
      parameters:
        - $ref: '#/components/parameters/ServiceOrderIdPath'
      responses:
        '200':
          $ref: '#/components/responses/EmptyEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/client-id/{cliente_id}:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersByClientId
      summary: Lista ordens por cliente ID
      parameters:
        - $ref: '#/components/parameters/ClienteIdPath'
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/client-name/{client_name}:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersByClientName
      summary: Lista ordens por nome do cliente
      parameters:
        - $ref: '#/components/parameters/ClientNamePath'
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/client-email/{client_email}:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersByClientEmail
      summary: Lista ordens por email do cliente
      parameters:
        - $ref: '#/components/parameters/ClientEmailPath'
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/client-number/{client_number}:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersByClientNumber
      summary: Lista ordens por número do cliente
      parameters:
        - $ref: '#/components/parameters/ClientNumberPath'
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/three-months:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersLastThreeMonths
      summary: Ordens dos últimos três meses
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /service-orders/six-months:
    get:
      tags: [ServiceOrders]
      operationId: listServiceOrdersLastSixMonths
      summary: Ordens dos últimos seis meses
      responses:
        '200':
          $ref: '#/components/responses/ServiceOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ClientIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 1
    ProductIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 1
    SaleIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 1
    ServiceOrderIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 1
    ClienteIdPath:
      name: cliente_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 1
    ClientNamePath:
      name: client_name
      in: path
      required: true
      schema:
        type: string
      example: João
    ClientEmailPath:
      name: client_email
      in: path
      required: true
      schema:
        type: string
        format: email
      example: joao@gmail.com
    ClientNumberPath:
      name: client_number
      in: path
      required: true
      schema:
        type: string
      example: "75999999999"

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    Unauthorized:
      description: Não autenticado ou token inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    InternalError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    EmptyEnvelope:
      description: Operação concluída
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    GenericEnvelope:
      description: Resposta padronizada sem tipagem específica do campo data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    ClientEnvelope:
      description: Resposta com um cliente
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cliente'
    ClientListEnvelope:
      description: Resposta com uma lista de clientes
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cliente'
    ClientEnvelopeCreated:
      description: Cliente criado com sucesso
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cliente'
    ProductEnvelope:
      description: Resposta com um produto
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Produto'
    ProductListEnvelope:
      description: Resposta com uma lista de produtos
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Produto'
    ProductEnvelopeCreated:
      description: Produto criado com sucesso
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Produto'
    SaleEnvelope:
      description: Resposta com uma venda
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Venda'
    SaleEnvelopeCreated:
      description: Venda criada com sucesso
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Venda'
    ServiceOrderEnvelope:
      description: Resposta com uma ordem de serviço
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrdemServico'
    ServiceOrderEnvelopeCreated:
