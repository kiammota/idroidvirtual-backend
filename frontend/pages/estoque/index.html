<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f06522">
  <title>Estoque · IDroid Virtual</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <header class="app-header">
    <button class="back-btn" id="btn-back" aria-label="Voltar">←</button>
    <h1>Estoque &amp; Aparelhos</h1>
  </header>

  <main class="app-main">
    <div class="tabs" id="est-tabs">
      <button class="tab active" data-tab="produtos">Produtos</button>
      <button class="tab" data-tab="entrada">Entrada</button>
      <button class="tab" data-tab="brindes">Brindes</button>
    </div>

    <section id="tab-produtos">
      <div id="est-list">
        <div class="empty-state"><div class="icon">📦</div><p>Estoque vazio.</p></div>
      </div>
    </section>

    <section id="tab-entrada" class="hidden">
      <form id="form-entrada">
        <div class="form-group">
          <label for="ent-nome">Nome / Modelo *</label>
          <input type="text" id="ent-nome" required>
        </div>
        <div class="form-group">
          <label for="ent-categoria">Categoria *</label>
          <select id="ent-categoria">
            <option value="CELULAR">Celular</option>
            <option value="ACESSORIO">Acessório</option>
            <option value="PECA">Peça</option>
            <option value="OUTRO">Outro</option>
          </select>
        </div>
        <div class="form-group">
          <label for="ent-imei">IMEI (obrigatório p/ celular)</label>
          <input type="text" id="ent-imei" maxlength="15" inputmode="numeric" placeholder="15 dígitos">
        </div>
        <div class="form-group">
          <label for="ent-preco">Preço (R$)</label>
          <input type="number" id="ent-preco" step="0.01" min="0" inputmode="decimal">
        </div>
        <div class="form-group">
          <label for="ent-qtd">Quantidade *</label>
          <input type="number" id="ent-qtd" value="1" min="1" required inputmode="numeric">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Registrar Entrada</button>
      </form>
    </section>

    <section id="tab-brindes" class="hidden">
      <p class="text-muted mb-2" style="font-size:0.9rem">Controle de perdas operacionais e saída de brindes.</p>
      <form id="form-brinde">
        <div class="form-group">
          <label for="bri-produto">Produto / Descrição *</label>
          <input type="text" id="bri-produto" required>
        </div>
        <div class="form-group">
          <label for="bri-qtd">Quantidade *</label>
          <input type="number" id="bri-qtd" value="1" min="1" required>
        </div>
        <div class="form-group">
          <label for="bri-motivo">Motivo</label>
          <input type="text" id="bri-motivo" placeholder="Brinde, perda, troca…">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Registrar Saída de Brinde</button>
      </form>
      <div class="card mt-2">
        <div class="card-title">Histórico recente</div>
        <div id="bri-hist" class="text-muted" style="font-size:0.85rem">Nenhuma movimentação.</div>
      </div>
    </section>
  </main>

  
  <script type="module" src="../../js/pages/estoque.js"></script>
</body>
</html>
