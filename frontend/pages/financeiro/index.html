<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f06522">
  <title>Financeiro · IDroid Virtual</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <header class="app-header">
    <button class="back-btn" id="btn-back" aria-label="Voltar">←</button>
    <h1>Financeiro &amp; Faturamento</h1>
  </header>

  <main class="app-main">
    <div class="tabs" id="fin-tabs">
      <button class="tab active" data-tab="fechamento">Fechamento</button>
      <button class="tab" data-tab="contas">Contas a pagar</button>
    </div>

    <section id="tab-fechamento">
      <div class="flex gap-1 mb-2">
        <button class="btn btn-outline btn-sm" id="btn-dia" style="flex:1">Dia</button>
        <button class="btn btn-primary btn-sm" id="btn-mes" style="flex:1">Mês</button>
      </div>

      <div class="card">
        <div class="card-title">Ganhos de Serviços (OS)</div>
        <div class="summary-row"><span>Total serviços</span><span id="f-servicos">R$ 0,00</span></div>
        <div class="summary-row"><span>Qtd. OS</span><span id="f-qtd-os">0</span></div>
      </div>
      <div class="card">
        <div class="card-title">Ganhos de Vendas</div>
        <div class="summary-row"><span>Total vendas</span><span id="f-vendas">R$ 0,00</span></div>
        <div class="summary-row"><span>Qtd. vendas</span><span id="f-qtd-vendas">0</span></div>
      </div>
      <div class="card">
        <div class="card-title">Resultado</div>
        <div class="summary-row"><span>Faturamento bruto</span><span id="f-bruto">R$ 0,00</span></div>
        <div class="summary-row"><span>Despesas</span><span id="f-despesas">0</span></div>
        <div class="summary-row total"><span>Lucro líquido</span><span id="f-lucro">R$ 0,00</span></div>
      </div>
    </section>

    <section id="tab-contas" class="hidden">
      <p class="text-muted mb-2" style="font-size:0.9rem">Lembretes de contas recorrentes</p>
      <div id="contas-list"></div>
      <form id="form-conta" class="card mt-2">
        <div class="card-title">Adicionar lembrete</div>
        <div class="form-group">
          <label for="conta-nome">Descrição *</label>
          <input type="text" id="conta-nome" required placeholder="Ex: Aluguel, Luz, Internet">
        </div>
        <div class="form-group">
          <label for="conta-valor">Valor (R$)</label>
          <input type="number" id="conta-valor" step="0.01" min="0" inputmode="decimal">
        </div>
        <div class="form-group">
          <label for="conta-dia">Dia do vencimento</label>
          <input type="number" id="conta-dia" min="1" max="31" value="10" inputmode="numeric">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Salvar</button>
      </form>
    </section>
  </main>

  
  <script type="module" src="../../js/pages/financeiro.js"></script>
</body>
</html>
