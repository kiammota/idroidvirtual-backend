<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f06522">
  <title>Nova Venda · IDroid Virtual</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <header class="app-header">
    <button class="back-btn" id="btn-back" aria-label="Voltar">←</button>
    <h1>Registrar Nova Venda</h1>
  </header>

  <main class="app-main">
    <form id="form-venda" class="animate-in">

      <!-- Cliente (OPCIONAL) -->
      <div class="card">
        <div class="card-title">Cliente <span class="text-muted" style="font-weight:400;font-size:0.85rem">(opcional)</span></div>
        <div class="form-group">
          <label for="venda-cliente">Nome do cliente</label>
          <input type="text" id="venda-cliente" list="lista-clientes" placeholder="Deixe em branco = Consumidor Final">
          <datalist id="lista-clientes"></datalist>
        </div>
        <input type="hidden" id="venda-cliente-id" value="0">
      </div>

      <!-- Produto -->
      <div class="card">
        <div class="card-title">Produto</div>
        <div class="form-group">
          <label for="venda-produto">Selecionar produto *</label>
          <select id="venda-produto" required>
            <option value="">Carregando produtos...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="venda-qtd">Quantidade *</label>
          <input type="number" id="venda-qtd" value="1" min="1" required inputmode="numeric">
        </div>
        <div class="form-group">
          <label for="venda-preco">Preço unitário (R$)</label>
          <input type="number" id="venda-preco" step="0.01" min="0" inputmode="decimal" readonly>
        </div>
      </div>

      <!-- Pagamento -->
      <div class="card">
        <div class="card-title">Pagamento</div>
        <div class="form-group">
          <label for="forma-pag">Forma de pagamento *</label>
          <select id="forma-pag" required>
            <option value="DINHEIRO">Dinheiro</option>
            <option value="PIX">Pix</option>
            <option value="CARTAO">Cartão</option>
            <option value="OUTROS">Outros</option>
          </select>
        </div>
      </div>

      <!-- Resumo -->
      <div class="summary-box">
        <div class="summary-row"><span>Quantidade</span><span id="r-qtd">1</span></div>
        <div class="summary-row"><span>Preço unitário</span><span id="r-preco">R$ 0,00</span></div>
        <div class="summary-row total"><span>Total a pagar</span><span id="r-total">R$ 0,00</span></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block mt-2">Finalizar Venda</button>
    </form>
  </main>

  <script type="module" src="../../js/pages/venda.js"></script>
</body>
</html>
