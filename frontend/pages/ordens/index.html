<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f06522">
  <title>Ordens de Serviço · IDroid Virtual</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <header class="app-header">
    <button class="back-btn" id="btn-back" aria-label="Voltar">←</button>
    <h1>Ordens de Serviço</h1>
  </header>

  <main class="app-main">
    <div class="tabs" id="os-tabs">
      <button class="tab active" data-tab="lista">Lista</button>
      <button class="tab" data-tab="nova">Nova OS</button>
    </div>

    <!-- Lista -->
    <section id="tab-lista">
      <div id="os-list">
        <div class="empty-state">
          <div class="icon">🛠️</div>
          <p>Nenhuma ordem de serviço ainda.</p>
        </div>
      </div>
    </section>

    <!-- Formulário nova OS -->
    <section id="tab-nova" class="hidden">
      <form id="form-os">
        <div class="form-group">
          <label for="os-cliente">Nome do cliente *</label>
          <input type="text" id="os-cliente" placeholder="Nome completo" required>
        </div>
        <div class="form-group">
          <label for="os-telefone">Telefone *</label>
          <input type="tel" id="os-telefone" placeholder="(00) 00000-0000" required inputmode="tel">
        </div>
        <div class="form-group">
          <label for="os-defeito">Defeito relatado *</label>
          <textarea id="os-defeito" rows="2" placeholder="Ex: Não liga, tela quebrada…" required></textarea>
        </div>
        <div class="form-group">
          <label for="os-servico">Serviço a realizar *</label>
          <textarea id="os-servico" rows="2" placeholder="Ex: Troca de display, limpeza…" required></textarea>
        </div>
        <div class="form-group">
          <label for="os-valor">Valor (R$)</label>
          <input type="number" id="os-valor" placeholder="0,00" step="0.01" min="0" inputmode="decimal">
        </div>

        <div class="form-group">
          <label>Assinatura do cliente (retirada)</label>
          <div class="signature-area">
            <canvas id="sig-canvas" width="400" height="160"></canvas>
          </div>
          <div class="signature-actions">
            <button type="button" class="btn btn-ghost btn-sm" id="sig-clear">Limpar</button>
            <button type="button" class="btn btn-outline btn-sm" id="sig-confirm">Confirmar assinatura</button>
          </div>
          <input type="hidden" id="os-assinatura">
          <p class="text-muted" style="font-size:0.75rem;margin-top:4px" id="sig-status">Aguardando assinatura…</p>
        </div>

        <div id="os-alerta" class="hidden" style="background:#fef3c7;border-radius:10px;padding:12px;margin-bottom:12px;font-size:0.9rem;color:#92400e">
          ⚠️ Já existe atendimento para este telefone. Verifique para evitar duplicidade.
        </div>

        <button type="submit" class="btn btn-primary btn-block">Salvar Ordem de Serviço</button>
      </form>
    </section>
  </main>

  
  <script type="module" src="../../js/pages/ordens.js"></script>
</body>
</html>
