<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f06522">
  <title>Entregas · IDroid Virtual</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="icon" href="../../assets/logo.svg" type="image/svg+xml">
</head>
<body>
  <header class="app-header">
    <button class="back-btn" id="btn-back" aria-label="Voltar">←</button>
    <h1>Gestão de Entregas</h1>
  </header>

  <main class="app-main">
    <div class="tabs" id="ent-tabs">
      <button class="tab active" data-tab="lista">Em andamento</button>
      <button class="tab" data-tab="nova">Nova</button>
    </div>

    <section id="tab-lista">
      <div id="ent-list">
        <div class="empty-state"><div class="icon">🛵</div><p>Nenhuma entrega em andamento.</p></div>
      </div>
    </section>

    <section id="tab-nova" class="hidden">
      <form id="form-entrega">
        <div class="form-group">
          <label for="ent-cliente">Cliente *</label>
          <input type="text" id="ent-cliente" required placeholder="Nome do cliente">
        </div>
        <div class="form-group">
          <label for="ent-produto">Produto / Aparelho *</label>
          <input type="text" id="ent-produto" required>
        </div>
        <div class="form-group">
          <label for="ent-motoboy">Motoboy responsável *</label>
          <input type="text" id="ent-motoboy" required placeholder="Nome do entregador">
        </div>
        <div class="form-group">
          <label for="ent-status">Status</label>
          <select id="ent-status">
            <option value="ENVIADO">Enviado</option>
            <option value="EM_TRANSPORTE">Em transporte</option>
            <option value="ENTREGUE">Entregue</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Registrar Entrega</button>
      </form>
    </section>
  </main>

  
  <script type="module" src="../../js/pages/entregas.js"></script>
</body>
</html>
